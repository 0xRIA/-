{% extends "base.html" %}

{% block title %}得意先更新 - 販売支援システム{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-8">
        <h2 class="header-title text-warning">得意先更新</h2>

        <div class="card card-custom p-4 mb-4">
            <form action="{% url 'psys:CustomerUpdate' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="action_type" value="search">
                <div class="row g-2 align-items-center">
                    <div class="col-auto">
                        <label for="Customer_code" class="col-form-label fw-bold">得意先コード</label>
                    </div>
                    <div class="col-auto">
                        <input type="text" name="Customer_code" id="Customer_code" class="form-control" maxlength="6" value="{{ customer_code|default:'' }}" placeholder="例: RA0001" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" name="search" class="btn btn-primary">検索</button>
                    </div>
                </div>
            </form>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        {% if customer %}
        <div class="card card-custom p-4 border-warning mb-4">
            <h5 class="text-warning mb-3">得意先情報の編集</h5>
            <form action="{% url 'psys:CustomerUpdate' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="action_type" value="update">
                <div class="mb-3">
                    <label for="update_code" class="form-label fw-bold">得意先コード</label>
                    <input type="text" name="Customer_code" id="update_code" class="form-control" value="{{ customer.customer_code }}" readonly style="background-color: #f0f0f0;">
                </div>
                <div class="mb-3">
                    <label for="Customer_name" class="form-label fw-bold">得意先名 <span class="text-danger">*</span></label>
                    <input type="text" name="Customer_name" id="Customer_name" class="form-control" maxlength="32" value="{{ customer.customer_name }}" required>
                </div>
                <div class="mb-3">
                    <label for="Customer_telno" class="form-label fw-bold">電話番号 <span class="text-danger">*</span></label>
                    <input type="text" name="Customer_telno" id="Customer_telno" class="form-control" maxlength="13" value="{{ customer.customer_telno }}" required>
                </div>
                <div class="mb-3">
                    <label for="Customer_postalcode" class="form-label fw-bold">郵便番号 <span class="text-danger">*</span></label>
                    <input type="text" name="Customer_postalcode" id="Customer_postalcode" class="form-control" maxlength="8" value="{{ customer.customer_postalcode }}" required>
                </div>
                <div class="mb-3">
                    <label for="Customer_address" class="form-label fw-bold">住所 <span class="text-danger">*</span></label>
                    <input type="text" name="Customer_address" id="Customer_address" class="form-control" maxlength="40" value="{{ customer.customer_address }}" required>
                </div>
                <div class="mb-4">
                    <label for="Discount_rate" class="form-label fw-bold">割引率 (%)</label>
                    <input type="number" name="Discount_rate" id="Discount_rate" class="form-control" min="0" max="99" value="{{ customer.discount_rate|default:'0' }}">
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'psys:CustomerUpdate' %}" name="cansel" class="btn btn-secondary">キャンセル</a>
                    <button type="submit" name="updatel" class="btn btn-warning">更新</button>
                </div>
            </form>
        </div>
        {% endif %}

        <div class="d-flex justify-content-between mt-4 pt-3 border-top">
            <div>
                <a href="{% url 'psys:CustomerManagementMenu' %}" name="CustomerMnagementMenuButton" class="btn btn-secondary me-2">得意先管理メニュー</a>
                <a href="{% url 'psys:CustomerUpdate' %}" name="back" class="btn btn-outline-secondary">戻る</a>
            </div>
            <a href="{% url 'psys:logout' %}" name="logoutButton" class="btn btn-outline-danger">ログアウト</a>
        </div>
    </div>
</div>
{% endblock %}

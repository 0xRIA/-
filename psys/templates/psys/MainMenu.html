{% extends "base.html" %}

{% block title %}管理メニュー - 販売支援システム{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <h2 class="header-title">管理メニュー</h2>
        <p class="text-muted">業務を選択してください。</p>

        <div class="row g-4 mt-2">
            <div class="col-md-6">
                <div class="card card-custom h-100 p-4 text-center">
                    <h4 class="card-title text-primary mb-3">得意先管理</h4>
                    <p class="card-text text-muted mb-4">
                        得意先情報の一覧表示、検索、新規登録、変更、削除を行います。
                    </p>
                    <a href="{% url 'psys:CustomerManagementMenu' %}" name="CustomerManagementMenu" class="btn btn-primary mt-auto">得意先管理</a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card card-custom h-100 p-4 text-center">
                    <h4 class="card-title text-success mb-3">得意先別集計</h4>
                    <p class="card-text text-muted mb-4">
                        月別受注集計、年次受注集計、商品別受注集計を行います。
                    </p>
                    <a href="{% url 'psys:OrderSummaryMenu' %}" name="CustomerOrderSummaryMenu" class="btn btn-success mt-auto">得意先集計</a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card card-custom h-100 p-4 text-center">
                    <h4 class="card-title text-info mb-3">従業員管理</h4>
                    <p class="card-text text-muted mb-4">
                        新規従業員のアカウント登録を行います。
                    </p>
                    <a href="{% url 'psys:EmployeeRegist' %}" class="btn btn-info text-white mt-auto">従業員新規登録</a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card card-custom h-100 p-4 text-center">
                    <h4 class="card-title text-danger mb-3">ログアウト</h4>
                    <p class="card-text text-muted mb-4">
                        システムから安全にログアウトします。
                    </p>
                    <a href="{% url 'psys:logout' %}" name="logoutButton" class="btn btn-outline-danger mt-auto">ログアウト</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom p-5 text-center">
            <div class="mb-4">
                <h4 class="text-muted mb-2">健康食品ロイヤル社</h4>
                <h2 class="display-6 fw-bold mb-3">販売支援システム</h2>

            <p class="text-muted mb-4 px-2">
                社内業務（得意先管理・得意先別集計）を行うための専用ポータルです。<br>
                システムを利用するには従業員アカウントでログインしてください。

            <div class="d-grid gap-3 col-8 mx-auto">
                <a href="{% url 'psys:login' %}" name="loginButton" class="btn btn-primary btn-lg">ログイン</a>

        </div>

{% endblock %}

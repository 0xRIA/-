{% extends "base.html" %}

{% block title %}トップページ - 販売支援システム{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom p-5 text-center position-relative overflow-hidden">
            <!-- osu! Hit Circle 風の巨大背景サークル装飾 -->
            <div style="position: absolute; top: -50px; right: -50px; width: 160px; height: 160px; border-radius: 50%; border: 4px solid rgba(255, 102, 170, 0.15); pointer-events: none;"></div>
            <div style="position: absolute; bottom: -40px; left: -40px; width: 140px; height: 140px; border-radius: 50%; border: 4px solid rgba(168, 85, 247, 0.15); pointer-events: none;"></div>

            <div class="mb-3">
                <div class="osu-badge mx-auto mb-3" style="width: 72px; height: 72px; font-size: 1.8rem; border-radius: 50%; background: linear-gradient(135deg, var(--osu-pink), var(--osu-purple)); display: flex; align-items: center; justify-content: center; box-shadow: var(--osu-glow-strong);">
                    PS
                </div>
                <h4 class="text-muted fw-bold text-uppercase tracking-wider mb-2">健康食品ロイヤル社</h4>
                <h2 class="display-6 fw-bold text-gradient mb-3">販売支援システム</h2>
            </div>

            <p class="text-muted mb-4 px-2" style="line-height: 1.8;">
                社内業務（得意先管理・得意先別集計）を行うための専用ポータルです。<br>
                システムを利用するには従業員アカウントでログインしてください。
            </p>

            <div class="d-grid gap-3 col-10 mx-auto">
                <a href="{% url 'psys:login' %}" name="loginButton" class="btn btn-primary btn-lg shadow">ログイン</a>
                <a href="{% url 'psys:EmployeeRegist' %}" name="registerButton" class="btn btn-secondary">新規従業員登録</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

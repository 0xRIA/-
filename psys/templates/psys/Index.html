{% extends "base.html" %}

{% block title %}トップページ - 販売支援システム{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom p-4 text-center">
            <h2 class="mb-3 text-primary">健康食品ロイヤル社</h2>
            <h4 class="mb-4 text-secondary">販売支援システム</h4>
            <p class="text-muted mb-4">
                社内業務（得意先管理・得意先別集計）を行うためのポータルサイトです。<br>
                システムを利用するには従業員アカウントでログインしてください。
            </p>
            <div class="d-grid gap-3">
                <a href="{% url 'psys:login' %}" name="loginButton" class="btn btn-primary btn-lg">ログイン</a>
                <a href="{% url 'psys:EmployeeRegist' %}" name="registerButton" class="btn btn-outline-secondary">新規従業員登録</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

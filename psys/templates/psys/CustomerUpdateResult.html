{% extends "base.html" %}

{% block title %}得意先更新結果 - 販売支援システム{% endblock %}

{% block content %}
<h1>得意先更新結果</h1>

{% if success %}
<p style="color: green;">更新を完了しました。</p>
{% else %}
<p style="color: red;">更新できませんでした。{{ error_detail }}</p>
{% endif %}

<p>
    <a href="{% url 'psys:CustomerUpdate' %}"><button type="button" name="back">戻る</button></a>
    <a href="{% url 'psys:CustomerManagementMenu' %}"><button type="button" name="CustomerMnagementMenuButton">得意先管理メニュー</button></a>
</p>
{% endblock %}

{% extends "base.html" %}

{% block title %}ログイン - 販売支援システム{% endblock %}

{% block content %}
<h1>ログイン画面</h1>

{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}

<form action="{% url 'psys:login' %}" method="post">
    {% csrf_token %}
    <p>従業員番号：<input type="text" name="Employee_no" id="Employee_no" maxlength="6" value="{{ employee_no|default:'' }}"></p>
    <p>パスワード：<input type="password" name="password" id="password" maxlength="8"></p>
    <p>
        <input type="submit" name="loginButton" value="ログイン">
        <a href="{% url 'psys:Index' %}"><button type="button" name="topButton">top</button></a>
    </p>
</form>
{% endblock %}
